# Taxonomap edge cache. Deploy with `npm run worker:deploy`.
name = "taxonomap-edge"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# The Cache API does nothing on *.workers.dev, so a custom domain is required.
routes = [{ pattern = "gbif.taxonomap.com", custom_domain = true }]

[vars]
UPSTREAM = "https://api.gbif.org"
# Contact address sent to GBIF in the User-Agent.
CONTACT_EMAIL = "info@taxonomap.com"
# Site origins allowed to call the edge (comma-separated). "*" allows any site.
# localhost:4321 is where astro dev/preview and the e2e tests run.
ALLOWED_ORIGINS = "https://app.taxonomap.com,https://taxonomap.pages.dev,http://localhost:4321"

[observability]
enabled = true
