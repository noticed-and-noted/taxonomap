name: Preview cleanup

# Deletes a pull request's previews (see the deploy job in ci.yml), on Cloudflare Pages and GitHub, once it closes.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    name: Delete preview deployments
    # Fork PRs never get a preview, nor the secrets to delete one.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # The head commit stays fetchable after its branch is deleted; the merge ref may not.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: .github/scripts
      # No pnpm here: only wrangler, through npx, so no package-manager cache to set up.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: .github/scripts/prune-previews.sh
        env:
          KEEP: none
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'taxonomap' }}
          BRANCH: pr-${{ github.event.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
