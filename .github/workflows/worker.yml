name: Edge Worker

# Deploys the optional GBIF edge cache (worker/). Runs only when the
# repository variable EDGE_ENABLED is "true".
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.EDGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Worker unit tests
        run: npx vitest run tests/unit/worker.test.ts
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy --config worker/wrangler.toml
            --var CONTACT_EMAIL:${{ vars.GBIF_CONTACT_EMAIL }}
            --var ALLOWED_ORIGINS:${{ vars.EDGE_ALLOWED_ORIGINS }}
