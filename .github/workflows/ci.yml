name: CI

on:
  # Other branches get CI through pull requests; only main deploys.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily bake: fetch the GBIF data the next build uses (02:00 UTC). It deploys nothing.
    - cron: '0 2 * * *'
    # Weekly live contract tests (Monday 04:00 UTC).
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      contract:
        description: Run live GBIF contract tests
        type: boolean
        default: false
      bake:
        description: Bake fresh GBIF data now
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, format, typecheck
    if: github.event.schedule != '0 4 * * 1' && github.event.schedule != '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check

  unit:
    name: Unit tests
    if: github.event.schedule != '0 4 * * 1' && github.event.schedule != '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  bake:
    name: Bake GBIF data
    if: github.event.schedule == '0 2 * * *' || inputs.bake
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLIC_GBIF_API_BASE: ${{ vars.PUBLIC_GBIF_API_BASE || 'https://api.gbif.org' }}
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
      SPECIES_PRERENDER_COUNT: ${{ vars.SPECIES_PRERENDER_COUNT || '0' }}
      NAME_INDEX_SIZE: ${{ vars.NAME_INDEX_SIZE || '300' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GBIF, Wikipedia, Wiktionary and iNaturalist response cache, so a failed run can pick up where it stopped.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/gbif
            .cache/inat
          key: gbif-${{ github.run_id }}
          restore-keys: gbif-
      - run: pnpm bake
      # Saved even when the bake fails or times out; actions/cache only saves on success.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: |
            .cache/gbif
            .cache/inat
          key: gbif-${{ github.run_id }}
      - uses: actions/cache/save@v4
        with:
          path: .cache/baked
          key: baked-${{ github.run_id }}

  build:
    name: Build
    # Waits for a manual bake so the deploy uses its data; bake is skipped on every other run.
    needs: [verify, unit, bake]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.unit.result == 'success' &&
      needs.bake.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_GBIF_API_BASE: ${{ vars.PUBLIC_GBIF_API_BASE || 'https://api.gbif.org' }}
      PUBLIC_GBIF_TILE_BASE: ${{ vars.PUBLIC_GBIF_TILE_BASE || 'https://api.gbif.org' }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://app.taxonomap.com' }}
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
      # Species pre-rendering is off for now to keep deploys quick (species
      # pages render client-side at /species/view). Set these repo variables
      # to restore it, e.g. 2000 pages and a 6000-name index.
      SPECIES_PRERENDER_COUNT: ${{ vars.SPECIES_PRERENDER_COUNT || '0' }}
      NAME_INDEX_SIZE: ${{ vars.NAME_INDEX_SIZE || '300' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Data from the latest bake. The build makes no external requests: what the bake lacks, the browser fetches.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/baked
          key: baked-none
          restore-keys: baked-

      - run: pnpm build
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright journeys (${{ matrix.shard }}/3)
    # The journeys build their own site against a fake GBIF (tests/e2e/fake), so they
    # need neither the live build nor the network, and start straight away.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # A third of the journeys each, on machines of their own: the journeys are CPU-bound, so more machines,
    # not more workers on one, are what make the run shorter. Each shard builds the fake site itself.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:e2e
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3

  coverage-badges:
    name: Coverage badges
    # Only main's figures reach the README. Nothing depends on this job, so it can't hold up a deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The summary is still written when a coverage threshold fails, and the badge should show that figure.
      - run: pnpm test:coverage
        continue-on-error: true
      - run: pnpm build:e2e
      - run: pnpm test:e2e:coverage
      - name: Draw the badges
        run: |
          draw_badge() {
            percent=$(jq '.total.lines.pct | round' "$2")
            curl --fail --silent --show-error --output "$3" "https://img.shields.io/badge/$1-$percent%25-3f5c4c"
          }
          draw_badge unit_coverage coverage/coverage-summary.json coverage-unit.svg
          draw_badge e2e_coverage coverage/e2e/coverage-summary.json coverage-e2e.svg
      # A single force-pushed commit on its own branch, so main's history stays free of badge updates.
      - name: Publish the badges
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --orphan badges
          git add coverage-unit.svg coverage-e2e.svg
          git commit --message 'Update coverage badges'
          git push --force origin badges

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # A skipped bake upstream would skip this job under the default success() check.
    # Pull requests deploy a preview; those from forks are skipped, as they get no secrets.
    if: >-
      !cancelled() && needs.build.result == 'success' && (
        (github.ref == 'refs/heads/main' &&
         (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        id: pages
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Adds a "View deployment" link to the pull request.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'taxonomap' }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
      # Only the pull request's newest commit keeps a preview: drop the earlier ones, on Cloudflare and GitHub.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      # No pnpm here: only wrangler, through npx, so no package-manager cache to set up.
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - if: github.event_name == 'pull_request'
        run: .github/scripts/prune-previews.sh
        env:
          KEEP: latest
          KEEP_ID: ${{ steps.pages.outputs.pages-deployment-id }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'taxonomap' }}
          BRANCH: pr-${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  contract:
    name: GBIF contract tests (live)
    if: github.event.schedule == '0 4 * * 1' || inputs.contract
    runs-on: ubuntu-latest
    env:
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
