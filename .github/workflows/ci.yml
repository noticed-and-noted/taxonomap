name: CI

on:
  # Other branches get CI through pull requests; only main deploys.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly rebuild refreshes baked data and pre-rendered species pages.
    - cron: '0 3 * * *'
    # Weekly live contract tests (Monday 04:00 UTC).
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      contract:
        description: Run live GBIF contract tests
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, unit tests
    if: github.event.schedule != '0 4 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check

  build:
    name: Build
    needs: verify
    runs-on: ubuntu-latest
    env:
      PUBLIC_GBIF_API_BASE: ${{ vars.PUBLIC_GBIF_API_BASE || 'https://api.gbif.org' }}
      PUBLIC_GBIF_TILE_BASE: ${{ vars.PUBLIC_GBIF_TILE_BASE || 'https://api.gbif.org' }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://app.taxonomap.com' }}
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
      # Species pre-rendering is off for now to keep deploys quick (species
      # pages render client-side at /species/view). Set these repo variables
      # to restore it, e.g. 2000 pages and a 6000-name index.
      SPECIES_PRERENDER_COUNT: ${{ vars.SPECIES_PRERENDER_COUNT || '0' }}
      NAME_INDEX_SIZE: ${{ vars.NAME_INDEX_SIZE || '300' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # GBIF response cache persists between runs. A new key is saved each day;
      # restore-keys picks up the most recent previous cache.
      - name: Date stamp
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/gbif
          key: gbif-${{ steps.date.outputs.today }}-${{ github.run_id }}
          restore-keys: |
            gbif-${{ steps.date.outputs.today }}-
            gbif-

      - run: npm run build
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  lighthouse:
    name: Lighthouse budget (mobile)
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Add a pre-rendered species page to the audit
        run: |
          page=$(find dist/species -mindepth 3 -name index.html -not -path '*/view/*' | head -1)
          if [ -n "$page" ]; then
            jq --arg u "http://localhost/${page#dist/}" '.ci.collect.url += [$u]' lighthouserc.json > lhci.json && mv lhci.json lighthouserc.json
          fi
      - run: npx --yes @lhci/cli@0.15.1 autorun

  e2e:
    name: Playwright journeys
    # The journeys build their own site against a fake GBIF (tests/e2e/fake), so they
    # need neither the live build nor the network, and run alongside it.
    needs: verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e
      - run: npm run test:e2e

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # The Pages Functions in functions/ (the login gate) deploy alongside dist.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: functions
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'taxonomap' }} --branch=main

  contract:
    name: GBIF contract tests (live)
    if: github.event.schedule == '0 4 * * 1' || inputs.contract
    runs-on: ubuntu-latest
    env:
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:contract
