name: CI

on:
  # Other branches get CI through pull requests; only main deploys.
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily bake: fetch the GBIF data the next build uses (02:00 UTC). It deploys nothing.
    - cron: '0 2 * * *'
    # Weekly live contract tests (Monday 04:00 UTC).
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      contract:
        description: Run live GBIF contract tests
        type: boolean
        default: false
      bake:
        description: Bake fresh GBIF data now
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, typecheck, unit tests
    if: github.event.schedule != '0 4 * * 1' && github.event.schedule != '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check

  bake:
    name: Bake GBIF data
    if: github.event.schedule == '0 2 * * *' || inputs.bake
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLIC_GBIF_API_BASE: ${{ vars.PUBLIC_GBIF_API_BASE || 'https://api.gbif.org' }}
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
      SPECIES_PRERENDER_COUNT: ${{ vars.SPECIES_PRERENDER_COUNT || '0' }}
      NAME_INDEX_SIZE: ${{ vars.NAME_INDEX_SIZE || '300' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GBIF response cache, so a failed run can pick up where it stopped.
      - uses: actions/cache@v4
        with:
          path: .cache/gbif
          key: gbif-${{ github.run_id }}
          restore-keys: gbif-
      - run: pnpm bake
      - uses: actions/cache/save@v4
        with:
          path: .cache/baked
          key: baked-${{ github.run_id }}

  build:
    name: Build
    # Waits for a manual bake so the deploy uses its data; bake is skipped on every other run.
    needs: [verify, bake]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.bake.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      PUBLIC_GBIF_API_BASE: ${{ vars.PUBLIC_GBIF_API_BASE || 'https://api.gbif.org' }}
      PUBLIC_GBIF_TILE_BASE: ${{ vars.PUBLIC_GBIF_TILE_BASE || 'https://api.gbif.org' }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://app.taxonomap.com' }}
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
      # Species pre-rendering is off for now to keep deploys quick (species
      # pages render client-side at /species/view). Set these repo variables
      # to restore it, e.g. 2000 pages and a 6000-name index.
      SPECIES_PRERENDER_COUNT: ${{ vars.SPECIES_PRERENDER_COUNT || '0' }}
      NAME_INDEX_SIZE: ${{ vars.NAME_INDEX_SIZE || '300' }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Data from the latest bake. Without one, the build fetches it from GBIF itself.
      - uses: actions/cache/restore@v4
        with:
          path: .cache/baked
          key: baked-none
          restore-keys: baked-

      # GBIF response cache for what the build still fetches (species pages, if pre-rendered).
      - uses: actions/cache@v4
        with:
          path: .cache/gbif
          key: gbif-${{ github.run_id }}
          restore-keys: gbif-

      - run: pnpm build
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright journeys
    # The journeys build their own site against a fake GBIF (tests/e2e/fake), so they
    # need neither the live build nor the network, and run alongside it.
    needs: verify
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:e2e
      - run: pnpm test:e2e

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # The Pages Functions in functions/ (the login gate) deploy alongside dist.
      - uses: actions/checkout@v5
        with:
          # Only functions/: with package.json present the action installs wrangler into the project and fails.
          sparse-checkout: /functions/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'taxonomap' }} --branch=main

  contract:
    name: GBIF contract tests (live)
    if: github.event.schedule == '0 4 * * 1' || inputs.contract
    runs-on: ubuntu-latest
    env:
      GBIF_CONTACT_EMAIL: ${{ vars.GBIF_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract
